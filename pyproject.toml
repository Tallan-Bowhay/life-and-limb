[project]
name = "life-and-limb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TallanBowhay", email = "Tallan.Bowhay@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "branca>=0.8.2",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "shapely>=2.1.2",
    "shiny>=1.7.0",
]

[project.scripts]
life-and-limb = "life_and_limb:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
